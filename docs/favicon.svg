<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64"
     viewBox="0 0 64 64">
  <title>P2P network icon</title>

  <!-- Connections (lines) -->
  <g stroke="#4A90E2" stroke-width="2" stroke-linecap="round">
    <!-- Hexagon perimeter -->
    <line x1="52"   y1="32"    x2="42"   y2="14.68"/>
    <line x1="42"   y1="14.68" x2="22"   y2="14.68"/>
    <line x1="22"   y1="14.68" x2="12"   y2="32"/>
    <line x1="12"   y1="32"    x2="22"   y2="49.32"/>
    <line x1="22"   y1="49.32" x2="42"   y2="49.32"/>
    <line x1="42"   y1="49.32" x2="52"   y2="32"/>
    <!-- Cross links for a denser mesh -->
    <line x1="52"   y1="32"    x2="12"   y2="32"/>
    <line x1="42"   y1="14.68" x2="22"   y2="49.32"/>
    <line x1="22"   y1="14.68" x2="42"   y2="49.32"/>
  </g>

  <!-- Nodes (circles) -->
  <g fill="#fff" stroke="#4A90E2" stroke-width="2">
    <circle cx="52" cy="32"   r="5"/>
    <circle cx="42" cy="14.68" r="5"/>
    <circle cx="22" cy="14.68" r="5"/>
    <circle cx="12" cy="32"   r="5"/>
    <circle cx="22" cy="49.32" r="5"/>
    <circle cx="42" cy="49.32" r="5"/>
  </g>
</svg>
